name: erp

# The app's Postgres for development: `bun run db:up` starts it and `bun run db:down` stops it. The `pgdata` volume
# keeps the data; `docker compose down -v` removes it. Port 55433 avoids a local Postgres on 5432 and the
# other Protobase templates, which take 55432, 55434 and 55435.
services:
  postgres:
    image: postgres:18
    ports:
      - '55433:5432'
    environment:
      POSTGRES_USER: protobase
      POSTGRES_PASSWORD: protobase
      POSTGRES_DB: protobase
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protobase -d protobase']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
